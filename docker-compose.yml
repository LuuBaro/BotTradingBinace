version: '3.9'

services:
  # ============================================================================
  # PostgreSQL Database (replaces SQLite)
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: bottrading-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-bottrading}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-bottrading}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/postgres/backup:/backups
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bottrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - bottrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Redis Cache & Job Queue
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: bottrading-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - bottrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  api:
    build:
      context: .
      dockerfile: ./docker/api/Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: bottrading-api
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-bottrading}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-bottrading}
      
      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      API_ENVIRONMENT: ${ENVIRONMENT:-production}
      
      # JWT & Security
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: "HS256"
      JWT_EXPIRATION_HOURS: "24"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: "/app/logs/api.log"
      
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      
      # LLM Configuration (from Phase 5)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
      SELECTED_LLM: ${SELECTED_LLM:-mock}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    ports:
      - "${API_PORT:-8000}:8000"
    
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./logs:/app/logs
      - ./backups:/app/backups
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    restart: unless-stopped
    networks:
      - bottrading-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # ============================================================================
  # Celery Worker (async tasks, learning analysis)
  # ============================================================================
  worker:
    build:
      context: .
      dockerfile: ./docker/worker/Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: bottrading-worker
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-bottrading}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-bottrading}
      
      # Redis (job broker)
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      
      # Celery
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-changeme}@redis:6379/2
      
      # Worker Configuration
      CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_TASKS_PER_CHILD: "1000"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FILE: "/app/logs/worker.log"
      
      # LLM Configuration
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY:-}
    
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./logs:/app/logs
      - ./backups:/app/backups
    
    restart: unless-stopped
    networks:
      - bottrading-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  nginx:
    image: nginx:alpine
    container_name: bottrading-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - bottrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ============================================================================
  # Monitoring & Logging (optional)
